name: Feature request
description: Propose an improvement to the solution or documentation
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or scenario
      description: Describe the operational problem or user scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior or result you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or alternative approaches.
  - type: textarea
    id: implications
    attributes:
      label: Azure scope, permissions, and cost
      description: Note any expected changes to Azure scope, required permissions, or cost.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I removed sensitive and customer-specific information.
          required: true
        - label: I searched existing issues for similar requests.
          required: true
